<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Classes Management | EduSphere LMS</title>
    <link rel="stylesheet" href="css/admin-dashboard.css">
    <link rel="stylesheet" href="css/page.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f5f8b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="images/icon-192.svg">
</head>

<body>

<div class="sidebar">
    <div class="logo"><h2>EduSphere LMS</h2></div>
    <ul>
        <li><a href="admin-dashboard.html"><i class="fa-solid fa-house"></i><span>Dashboard</span></a></li>
        <li><a href="students.html"><i class="fa-solid fa-user-graduate"></i><span>Students</span></a></li>
        <li><a href="teachers.html"><i class="fa-solid fa-chalkboard-user"></i><span>Teachers</span></a></li>
        <li class="active"><a href="classes.html"><i class="fa-solid fa-chalkboard"></i><span>Classes</span></a></li>
        <li><a href="courses.html"><i class="fa-solid fa-book-open"></i><span>Courses</span></a></li>
        <li><a href="results.html"><i class="fa-solid fa-square-poll-vertical"></i><span>Results</span></a></li>
        <li><a href="announcements.html"><i class="fa-solid fa-bullhorn"></i><span>Announcements</span></a></li>
        <li><a href="settings.html"><i class="fa-solid fa-gear"></i><span>Settings</span></a></li>
        <li class="logout-item"><a href="#"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a></li>
    </ul>
</div>

<div class="main-content">
    <div class="topbar">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search...">
        </div>
        <div class="top-icons">
            <i class="fa-regular fa-bell"></i>
            <img src="images/admin-dashboard/admin_dashboard.png" alt="Profile">
        </div>
    </div>

    <div class="page-header">
        <h1>Classes Management</h1>
        <p>Create and manage classes for your institution</p>
    </div>

    <div class="top-actions">
        <input type="text" id="searchClass" placeholder="Search Class...">
        <button id="addClassBtn"><i class="fa-solid fa-plus"></i> Add Class</button>
    </div>

    <div class="classes-grid" id="classesGrid">
        <!-- Classes cards will be loaded here -->
    </div>
</div>

<!-- ADD/EDIT CLASS MODAL -->
<div class="modal" id="classModal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2 id="modalTitle">Add New Class</h2>
        <form id="classForm">
            <div class="input-group">
                <label>Class Name</label>
                <input type="text" id="className" placeholder="e.g. BSCS-1A, BSSE-2B" required>
            </div>
            <div class="input-group">
                <label>Department</label>
                <select id="classDepartment" required>
                    <option value="">Select Department</option>
                    <option>Computer Science</option>
                    <option>Software Engineering</option>
                    <option>Information Technology</option>
                    <option>Data Science</option>
                    <option>Mathematics</option>
                    <option>English</option>
                </select>
            </div>
            <div class="input-group">
                <label>Semester</label>
                <select id="classSemester" required>
                    <option value="">Select Semester</option>
                    <option>1st Semester</option>
                    <option>2nd Semester</option>
                    <option>3rd Semester</option>
                    <option>4th Semester</option>
                    <option>5th Semester</option>
                    <option>6th Semester</option>
                    <option>7th Semester</option>
                    <option>8th Semester</option>
                </select>
            </div>
            <div class="input-group">
                <label>Section</label>
                <input type="text" id="classSection" placeholder="e.g. A, B, C" required>
            </div>
            <button type="submit" class="save-btn">Save Class</button>
        </form>
    </div>
</div>

<!-- CLASS DETAIL MODAL -->
<div class="modal" id="classDetailModal">
    <div class="modal-content modal-large">
        <span class="close-btn" id="closeDetailModal">&times;</span>
        <h2 id="detailModalTitle">Class Students</h2>
        <div class="class-students-list" id="classStudentsList">
            <!-- Students will be loaded here -->
        </div>
    </div>
</div>
    <script src="js/data.js"></script>
    <script src="js/demo-seed.js"></script>
<script src="js/admin-sidebar.js"></script>
<script src="js/classes.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(function(reg) { console.log('Service Worker registered'); })
                .catch(function(err) { console.log('Service Worker registration failed:', err); });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Courses Management | EduSphere LMS</title>
    <link rel="stylesheet" href="css/admin-dashboard.css">
    <link rel="stylesheet" href="css/page.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f5f8b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="images/icon-192.svg">
</head>

<body>

<div class="sidebar">
    <div class="logo"><h2>EduSphere LMS</h2></div>
    <ul>
        <li><a href="admin-dashboard.html"><i class="fa-solid fa-house"></i><span>Dashboard</span></a></li>
        <li><a href="students.html"><i class="fa-solid fa-user-graduate"></i><span>Students</span></a></li>
        <li><a href="teachers.html"><i class="fa-solid fa-chalkboard-user"></i><span>Teachers</span></a></li>
        <li><a href="classes.html"><i class="fa-solid fa-chalkboard"></i><span>Classes</span></a></li>
        <li class="active"><a href="courses.html"><i class="fa-solid fa-book-open"></i><span>Courses</span></a></li>
        <li><a href="results.html"><i class="fa-solid fa-square-poll-vertical"></i><span>Results</span></a></li>
        <li><a href="announcements.html"><i class="fa-solid fa-bullhorn"></i><span>Announcements</span></a></li>
        <li><a href="settings.html"><i class="fa-solid fa-gear"></i><span>Settings</span></a></li>
        <li class="logout-item"><a href="#"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a></li>
    </ul>
</div>

<div class="main-content">
    <div class="topbar">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search...">
        </div>
        <div class="top-icons">
            <i class="fa-regular fa-bell"></i>
            <img src="images/admin-dashboard/admin_dashboard.png" alt="Profile">
        </div>
    </div>

    <div class="page-header">
        <h1>Courses Management</h1>
        <p>Add, edit and manage courses</p>
    </div>

    <div class="top-actions">
        <input type="text" id="searchCourse" placeholder="Search Course...">
        <button id="addCourseBtn"><i class="fa-solid fa-plus"></i> Add Course</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Code</th>
                    <th>Course Name</th>
                    <th>Teacher</th>
                    <th>Class</th>
                    <th>Department</th>
                    <th>Credit Hours</th>
                    <th>Semester</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="courseTable"></tbody>
        </table>
    </div>
</div>

<!-- Add/Edit Course Modal -->
<div class="modal" id="courseModal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2 id="modalTitle">Add New Course</h2>
        <form id="courseForm">
            <div class="input-group">
                <label>Course Code</label>
                <input type="text" id="courseCode" placeholder="e.g. CS-101" required>
            </div>
            <div class="input-group">
                <label>Course Name</label>
                <input type="text" id="courseName" placeholder="e.g. Introduction to CS" required>
            </div>
            <div class="input-group">
                <label>Assign Teacher</label>
                <select id="courseTeacher">
                    <option value="">Select Teacher</option>
                </select>
            </div>
            <div class="input-group">
                <label>Assign Class</label>
                <select id="courseClass">
                    <option value="">Select Class</option>
                </select>
            </div>
            <div class="input-group">
                <label>Department</label>
                <select id="courseDepartment" required>
                    <option value="">Select Department</option>
                    <option>Computer Science</option>
                    <option>Software Engineering</option>
                    <option>Information Technology</option>
                    <option>Data Science</option>
                    <option>Mathematics</option>
                    <option>English</option>
                </select>
            </div>
            <div class="input-group">
                <label>Credit Hours</label>
                <input type="number" id="courseCredits" placeholder="e.g. 3" min="1" max="6" required>
            </div>
            <div class="input-group">
                <label>Semester</label>
                <select id="courseSemester" required>
                    <option value="">Select Semester</option>
                    <option>1st Semester</option>
                    <option>2nd Semester</option>
                    <option>3rd Semester</option>
                    <option>4th Semester</option>
                    <option>5th Semester</option>
                    <option>6th Semester</option>
                    <option>7th Semester</option>
                    <option>8th Semester</option>
                </select>
            </div>
            <button type="submit" class="save-btn">Save Course</button>
        </form>
    </div>
</div>

<!-- Enroll Classes Modal -->
<div class="modal" id="enrollModal">
    <div class="modal-content" style="width:550px;">
        <span class="close-btn">&times;</span>
        <h2>Enroll Classes</h2>
        <p style="color:#6b7280;margin-bottom:15px;" id="enrollCourseName"></p>

        <div class="input-group">
            <label>Select Classes (All students in selected classes will be enrolled)</label>
            <div id="classCheckboxes" style="max-height:300px;overflow-y:auto;border:1px solid #d1d5db;border-radius:10px;padding:10px;"></div>
        </div>

        <button type="button" class="save-btn" id="saveEnrollBtn">Save Enrollment</button>
    </div>
</div>
    <script src="js/data.js"></script>
    <script src="js/demo-seed.js"></script>
<script src="js/admin-sidebar.js"></script>
<script src="js/courses.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(function(reg) { console.log('Service Worker registered'); })
                .catch(function(err) { console.log('Service Worker registration failed:', err); });
        }
    </script>
</body>
</html>

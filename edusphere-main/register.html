<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register | EduSphere LMS</title>

    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/register.css">

    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f5f8b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="images/icon-192.svg">
</head>

<body>

<!--=========================
        NAVBAR
==========================-->

<header>

    <nav class="navbar">

        <div class="logo">
            <h2>EduSphere LMS</h2>
        </div>

        <ul class="nav-links">

            <li><a href="index.html">Home</a></li>

            <li><a href="about.html">About</a></li>

            <li><a href="features.html">Features</a></li>

            <li><a href="contact.html">Contact</a></li>

            <li><a href="login.html">Login</a></li>

            <li>
                <a href="register.html" class="active demo-btn">
                    Register
                </a>
            </li>

        </ul>

    </nav>

</header>

<!--=========================
      REGISTER SECTION
==========================-->

<section class="register-section">

    <div class="register-container">

        <!-- Left Side Image -->

        <div class="register-image">

            <img src="images/register/register.svg" alt="Register">

        </div>

        <!-- Right Side Form -->

        <div class="register-form">

            <h2>Create Your Account</h2>

            <p>
                Join EduSphere LMS and start your learning journey.
            </p>

            <form id="registerForm">

                <!-- Full Name -->

                <div class="input-box">

                    <i class="fa-solid fa-user"></i>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Full Name"
                        required>

                </div>

                <!-- Email -->

                <div class="input-box">

                    <i class="fa-solid fa-envelope"></i>

                    <input
                        type="email"
                        id="email"
                        placeholder="Email Address"
                        required>

                </div>

                <!-- Phone -->

                <div class="input-box">

                    <i class="fa-solid fa-phone"></i>

                    <input
                        type="tel"
                        id="phone"
                        placeholder="Phone Number"
                        required>

                </div>

                <!-- Role -->

                <div class="input-box">

                    <i class="fa-solid fa-user-graduate"></i>

                    <select id="role" required>

                        <option value="">Select Role</option>

                        <option value="teacher">Teacher</option>

                        <option value="student">Student</option>

                    </select>

                </div>

                <!-- Password -->

                <div class="input-box password-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="password"
                        placeholder="Password"
                        required>

                    <i class="fa-solid fa-eye" id="togglePassword"></i>

                </div>

                <!-- Confirm Password -->

                <div class="input-box password-box">

                    <i class="fa-solid fa-lock"></i>

                    <input
                        type="password"
                        id="confirmPassword"
                        placeholder="Confirm Password"
                        required>

                    <i class="fa-solid fa-eye" id="toggleConfirmPassword"></i>

                </div>

                <!-- Terms -->

                <div class="terms">

                    <label>

                        <input type="checkbox" required>

                        I agree to the Terms & Conditions

                    </label>

                </div>

                <!-- Button -->

                <button
                    type="submit"
                    class="register-btn">

                    Create Account

                </button>

            </form>

            <p class="login-link">

                Already have an account?

                <a href="login.html">

                    Login Here

                </a>

            </p>

        </div>

    </div>

</section>
    <script src="js/data.js"></script>
    <script src="js/demo-seed.js"></script>
<script src="js/register.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(function(reg) { console.log('Service Worker registered'); })
                .catch(function(err) { console.log('Service Worker registration failed:', err); });
        }
    </script>
</body>

</html>

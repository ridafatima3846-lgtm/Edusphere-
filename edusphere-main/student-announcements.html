<!DOCTYPE html>

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f5f8b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="images/icon-192.svg">

<body>

        SIDEBAR
=========================-->

<div class="sidebar">

    <div class="logo">

        <h2>EduSphere LMS</h2>

    </div>

    <ul>

        <li>
            <a href="student-dashboard.html">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>
        </li>

        <li>
            <a href="student-courses.html">
                <i class="fa-solid fa-book-open"></i>
                <span>My Courses</span>
            </a>
        </li>

        <li>
            <a href="student-assignments.html">
                <i class="fa-solid fa-file-lines"></i>
                <span>Assignments</span>
            </a>
        </li>

        <li>
            <a href="student-results.html">
                <i class="fa-solid fa-square-poll-vertical"></i>
                <span>Results</span>
            </a>
        </li>

        <li class="active">
            <a href="student-announcements.html">
                <i class="fa-solid fa-bullhorn"></i>
                <span>Announcements</span>
            </a>
        </li>

        <li>
            <a href="student-settings.html">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>
        </li>

        <li class="logout-item">
            <a href="#" id="logoutBtn">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </a>
        </li>

    </ul>

    <div class="topbar">

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                placeholder="Search announcements..."
                id="searchAnnouncement">

        </div>

        <div class="top-icons">

            <i class="fa-regular fa-bell"></i>

            <img
                src="images/admin-dashboard/admin_dashboard.png"
                alt="Profile">

        </div>

    </div>

    <!-- Page Header -->

    <div class="page-header">

        <h1>Announcements</h1>

        <p>
            View announcements from admin.
        </p>

    </div>

    <!--=========================
          ANNOUNCEMENTS LIST
    ==========================-->

    <div id="announcementsList">

    </div>

</div>
    <script src="js/data.js"></script>
    <script src="js/demo-seed.js"></script>
<script src="js/student-announcements.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(function(reg) { console.log('Service Worker registered'); })
                .catch(function(err) { console.log('Service Worker registration failed:', err); });
        }
    </script>

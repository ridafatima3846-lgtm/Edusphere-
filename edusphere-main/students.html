<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Students Management | EduSphere LMS</title>
    <link rel="stylesheet" href="css/admin-dashboard.css">
    <link rel="stylesheet" href="css/page.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f5f8b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="images/icon-192.svg">
</head>

<body>

<div class="sidebar">
    <div class="logo"><h2>EduSphere LMS</h2></div>
    <ul>
        <li><a href="admin-dashboard.html"><i class="fa-solid fa-house"></i><span>Dashboard</span></a></li>
        <li class="active"><a href="students.html"><i class="fa-solid fa-user-graduate"></i><span>Students</span></a></li>
        <li><a href="teachers.html"><i class="fa-solid fa-chalkboard-user"></i><span>Teachers</span></a></li>
        <li><a href="classes.html"><i class="fa-solid fa-chalkboard"></i><span>Classes</span></a></li>
        <li><a href="courses.html"><i class="fa-solid fa-book-open"></i><span>Courses</span></a></li>
        <li><a href="results.html"><i class="fa-solid fa-square-poll-vertical"></i><span>Results</span></a></li>
        <li><a href="announcements.html"><i class="fa-solid fa-bullhorn"></i><span>Announcements</span></a></li>
        <li><a href="settings.html"><i class="fa-solid fa-gear"></i><span>Settings</span></a></li>
        <li class="logout-item"><a href="#"><i class="fa-solid fa-right-from-bracket"></i><span>Logout</span></a></li>
    </ul>
</div>

<div class="main-content">
    <div class="topbar">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search...">
        </div>
        <div class="top-icons">
            <i class="fa-regular fa-bell"></i>
            <img src="images/admin-dashboard/admin_dashboard.png" alt="Profile">
        </div>
    </div>

    <div class="page-header">
        <h1>Students Management</h1>
        <p>Add, edit and manage student records</p>
    </div>

    <div class="top-actions">
        <div class="filter-group">
            <select id="filterClass">
                <option value="">All Classes</option>
            </select>
            <input type="text" id="searchStudent" placeholder="Search Student...">
        </div>
        <button id="addStudentBtn"><i class="fa-solid fa-plus"></i> Add Student</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Roll No</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>CNIC</th>
                    <th>Class</th>
                    <th>Department</th>
                    <th>Semester</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="studentTable"></tbody>
        </table>
    </div>
</div>

<div class="modal" id="studentModal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2 id="modalTitle">Add New Student</h2>
        <form id="studentForm">
            <div class="input-group">
                <label>Roll Number</label>
                <input type="text" id="rollNo" placeholder="Enter Roll Number" required>
            </div>
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="studentName" placeholder="Enter Student Name" required>
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="studentEmail" placeholder="Enter Email" required>
            </div>
            <div class="input-group">
                <label>CNIC</label>
                <input type="text" id="CNIC" placeholder="Enter CNIC" required>
            </div>
            <div class="input-group">
                <label>Class</label>
                <select id="studentClass" required>
                    <option value="">Select Class</option>
                </select>
            </div>
            <div class="input-group">
                <label>Department</label>
                <input type="text" id="department" placeholder="BS Computer Science" required>
            </div>
            <div class="input-group">
                <label>Semester</label>
                <select id="semester" required>
                    <option value="">Select Semester</option>
                    <option>1st Semester</option>
                    <option>2nd Semester</option>
                    <option>3rd Semester</option>
                    <option>4th Semester</option>
                    <option>5th Semester</option>
                    <option>6th Semester</option>
                    <option>7th Semester</option>
                    <option>8th Semester</option>
                </select>
            </div>
            <button type="submit" class="save-btn">Save Student</button>
        </form>
    </div>
</div>
    <script src="js/data.js"></script>
    <script src="js/demo-seed.js"></script>
<script src="js/admin-sidebar.js"></script>
<script src="js/students.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(function(reg) { console.log('Service Worker registered'); })
                .catch(function(err) { console.log('Service Worker registration failed:', err); });
        }
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Assignments | EduSphere LMS</title>

    <link rel="stylesheet" href="css/teacher-dashboard.css">
    <link rel="stylesheet" href="css/page.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f5f8b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="images/icon-192.svg">
</head>

<body>

<!--=========================
        SIDEBAR
=========================-->

<div class="sidebar">

    <div class="logo">

        <h2>EduSphere LMS</h2>

    </div>

    <ul>

        <li>
            <a href="teacher-dashboard.html">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>
        </li>

        <li>
            <a href="teacher-courses.html">
                <i class="fa-solid fa-book-open"></i>
                <span>My Courses</span>
            </a>
        </li>

        <li>
            <a href="teacher-students.html">
                <i class="fa-solid fa-user-graduate"></i>
                <span>My Students</span>
            </a>
        </li>

        <li class="active">
            <a href="teacher-assignments.html">
                <i class="fa-solid fa-file-lines"></i>
                <span>Assignments</span>
            </a>
        </li>

        <li>
            <a href="teacher-results.html">
                <i class="fa-solid fa-square-poll-vertical"></i>
                <span>Results</span>
            </a>
        </li>

        <li>
            <a href="teacher-announcements.html">
                <i class="fa-solid fa-bullhorn"></i>
                <span>Announcements</span>
            </a>
        </li>

        <li>
            <a href="teacher-settings.html">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>
        </li>

        <li class="logout-item">
            <a href="#" id="logoutBtn">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </a>
        </li>

    </ul>

</div>

<!--=========================
        MAIN
=========================-->

<div class="main-content">

    <!-- Top Bar -->

    <div class="topbar">

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                placeholder="Search assignments..."
                id="searchAssignment">

        </div>

        <div class="top-icons">

            <i class="fa-regular fa-bell"></i>

            <img
                src="images/admin-dashboard/admin_dashboard.png"
                alt="Profile">

        </div>

    </div>

    <!-- Page Header -->

    <div class="page-header">

        <h1>Assignments</h1>

        <p>
            Create and manage assignments for your courses.
        </p>

    </div>

    <!-- Top Actions -->

    <div class="top-actions">

        <button id="addAssignmentBtn">
            <i class="fa-solid fa-plus"></i>
            Create Assignment
        </button>

    </div>

    <!--=========================
          ASSIGNMENTS TABLE
    ==========================-->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Title</th>
                    <th>Course</th>
                    <th>Deadline</th>
                    <th>Marks</th>
                    <th>Actions</th>

                </tr>

            </thead>

            <tbody id="assignmentTable">

            </tbody>

        </table>

    </div>

</div>

<!--=========================
      ADD/EDIT MODAL
=========================-->

<div class="modal" id="assignmentModal">

    <div class="modal-content">

        <span class="close-btn">&times;</span>

        <h2 id="modalTitle">Create Assignment</h2>

        <form id="assignmentForm">

            <div class="input-group">

                <label>Title</label>

                <input
                    type="text"
                    id="assignmentTitle"
                    placeholder="Assignment title"
                    required>

            </div>

            <div class="input-group">

                <label>Course</label>

                <select id="assignmentCourse" required>

                    <option value="">Select Course</option>

                </select>

            </div>

            <div class="input-group">

                <label>Description</label>

                <input
                    type="text"
                    id="assignmentDescription"
                    placeholder="Assignment description">

            </div>

            <div class="input-group">

                <label>Deadline</label>

                <input
                    type="date"
                    id="assignmentDeadline"
                    required>

            </div>

            <div class="input-group">

                <label>Total Marks</label>

                <input
                    type="number"
                    id="assignmentMarks"
                    placeholder="e.g. 100"
                    required>

            </div>

            <button type="submit" class="save-btn">
                Save Assignment
            </button>

        </form>

    </div>

</div>
    <script src="js/data.js"></script>
    <script src="js/demo-seed.js"></script>
<script src="js/teacher-assignments.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(function(reg) { console.log('Service Worker registered'); })
                .catch(function(err) { console.log('Service Worker registration failed:', err); });
        }
    </script>
</body>

</html>

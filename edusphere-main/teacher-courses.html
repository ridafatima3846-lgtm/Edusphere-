<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Courses | EduSphere LMS</title>

    <link rel="stylesheet" href="css/teacher-dashboard.css">
    <link rel="stylesheet" href="css/page.css">

    <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <!-- PWA Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#1f5f8b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="images/icon-192.svg">
</head>

<body>

<!--=========================
        SIDEBAR
=========================-->

<div class="sidebar">

    <div class="logo">

        <h2>EduSphere LMS</h2>

    </div>

    <ul>

        <li>
            <a href="teacher-dashboard.html">
                <i class="fa-solid fa-house"></i>
                <span>Dashboard</span>
            </a>
        </li>

        <li class="active">
            <a href="teacher-courses.html">
                <i class="fa-solid fa-book-open"></i>
                <span>My Courses</span>
            </a>
        </li>

        <li>
            <a href="teacher-students.html">
                <i class="fa-solid fa-user-graduate"></i>
                <span>My Students</span>
            </a>
        </li>

        <li>
            <a href="teacher-assignments.html">
                <i class="fa-solid fa-file-lines"></i>
                <span>Assignments</span>
            </a>
        </li>

        <li>
            <a href="teacher-results.html">
                <i class="fa-solid fa-square-poll-vertical"></i>
                <span>Results</span>
            </a>
        </li>

        <li>
            <a href="teacher-announcements.html">
                <i class="fa-solid fa-bullhorn"></i>
                <span>Announcements</span>
            </a>
        </li>

        <li>
            <a href="teacher-settings.html">
                <i class="fa-solid fa-gear"></i>
                <span>Settings</span>
            </a>
        </li>

        <li class="logout-item">
            <a href="#" id="logoutBtn">
                <i class="fa-solid fa-right-from-bracket"></i>
                <span>Logout</span>
            </a>
        </li>

    </ul>

</div>

<!--=========================
        MAIN
=========================-->

<div class="main-content">

    <!-- Top Bar -->

    <div class="topbar">

        <div class="search-box">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input
                type="text"
                placeholder="Search courses..."
                id="searchCourse">

        </div>

        <div class="top-icons">

            <i class="fa-regular fa-bell"></i>

            <img
                src="images/admin-dashboard/admin_dashboard.png"
                alt="Profile">

        </div>

    </div>

    <!-- Page Header -->

    <div class="page-header">

        <h1>My Courses</h1>

        <p>
            Courses assigned to you.
        </p>

    </div>

    <!--=========================
          COURSES TABLE
    ==========================-->

    <div class="table-container">

        <table>

            <thead>

                <tr>

                    <th>Code</th>
                    <th>Course Name</th>
                    <th>Class</th>
                    <th>Department</th>
                    <th>Credits</th>
                    <th>Semester</th>
                    <th>Students</th>

                </tr>

            </thead>

            <tbody id="courseTable">

                <tr>
                    <td colspan="6" style="text-align:center;padding:30px;color:#6b7280;">
                        No courses assigned yet.
                    </td>
                </tr>

            </tbody>

        </table>

    </div>

</div>
    <script src="js/data.js"></script>
    <script src="js/demo-seed.js"></script>
<script src="js/teacher-courses.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(function(reg) { console.log('Service Worker registered'); })
                .catch(function(err) { console.log('Service Worker registration failed:', err); });
        }
    </script>
</body>

</html>

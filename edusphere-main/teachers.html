</head>

    </ul>

</div>

<!--=========================
        MAIN
=========================-->

<div class="main-content">

    <div class="topbar">
        <div class="search-box">
            <i class="fa-solid fa-magnifying-glass"></i>
            <input type="text" placeholder="Search...">
        </div>
        <div class="top-icons">
            <i class="fa-regular fa-bell"></i>
            <img src="images/admin-dashboard/admin_dashboard.png" alt="Profile">
        </div>
    </div>

    <div class="page-header">
        <h1>Teachers Management</h1>
        <p>Add, edit and manage teacher records</p>
    </div>

    <div class="top-actions">
        <input type="text" id="searchTeacher" placeholder="Search Teacher...">
        <button id="addTeacherBtn">
            <i class="fa-solid fa-plus"></i>
            Add Teacher
        </button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Email</th>
                    <th>Phone</th>
                    <th>Subject</th>
                    <th>Qualification</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="teacherTable">
            </tbody>
        </table>
    </div>

</div>

<!--=========================
      ADD/EDIT TEACHER MODAL
=========================-->

<div class="modal" id="teacherModal">
    <div class="modal-content">
        <span class="close-btn">&times;</span>
        <h2 id="modalTitle">Add New Teacher</h2>
        <form id="teacherForm">
            <div class="input-group">
                <label>Teacher ID</label>
                <input type="text" id="teacherId" placeholder="Enter Teacher ID" required>
            </div>
            <div class="input-group">
                <label>Full Name</label>
                <input type="text" id="teacherName" placeholder="Enter Teacher Name" required>
            </div>
            <div class="input-group">
                <label>Email</label>
                <input type="email" id="teacherEmail" placeholder="Enter Email" required>
            </div>
            <div class="input-group">
                <label>Phone</label>
                <input type="text" id="teacherPhone" placeholder="Enter Phone Number" required>
            </div>
            <div class="input-group">
                <label>Subject</label>
                <input type="text" id="teacherSubject" placeholder="e.g. Mathematics" required>
            </div>
            <div class="input-group">
                <label>Qualification</label>
                <select id="teacherQualification" required>
                    <option value="">Select Qualification</option>
                    <option>BS</option>
                    <option>MS</option>
                    <option>M.Phil</option>
                    <option>PhD</option>
                </select>
            </div>
            <button type="submit" class="save-btn">Save Teacher</button>
        </form>
    </div>
</div>
    <script src="js/data.js"></script>
    <script src="js/demo-seed.js"></script>
<script src="js/admin-sidebar.js"></script>
<script src="js/teachers.js"></script>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('service-worker.js')
                .then(function(reg) { console.log('Service Worker registered'); })
                .catch(function(err) { console.log('Service Worker registration failed:', err); });
        }
    </script>
</body>
